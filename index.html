<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Greeting Bot | MK Software</title>
  <style>
    :root {
      --bg-dark: #0b192c;
      --card-bg: #13294b;
      --gold: #d4af37;
      --gold-soft: rgba(212, 175, 55, 0.16);
      --accent-green: #2ecc71;
      --text-main: #f4f7fb;
      --text-muted: #b8c7dc;
      --border-subtle: rgba(212, 175, 55, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(145deg, var(--bg-dark), #07101d);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .bot-card {
      width: 100%;
      max-width: 620px;
      background: var(--card-bg);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    }

    .bot-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.55);
      border-color: var(--gold);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--gold);
      background: var(--gold-soft);
      padding: 6px 12px;
      border-radius: 999px;
      margin-bottom: 14px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-green);
    }

    h1 {
      font-size: 1.65rem;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 22px;
    }

    .output-box {
      background: #091424;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-left: 4px solid var(--gold);
      border-radius: 10px;
      padding: 18px;
      font-family: Consolas, "Courier New", monospace;
      font-size: 0.92rem;
      line-height: 1.7;
      color: var(--text-main);
    }

    .output-box p {
      padding: 4px 8px;
      border-radius: 6px;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .output-box p:hover {
      background-color: rgba(46, 204, 113, 0.12);
      color: #a9f5c8;
    }

    .output-box p:active {
      background-color: var(--gold-soft);
      color: var(--gold);
    }

    .footer-note {
      margin-top: 18px;
      font-size: 0.82rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    .footer-note span {
      color: var(--gold);
      font-weight: 500;
    }
  </style>
</head>
<body>
  <main class="bot-card">
    <div class="badge">
      <span class="dot"></span>
      JavaScript Console &amp; UI Demo
    </div>
    <h1>Greeting Bot</h1>
    <p class="subtitle">
      Interactive preview powered by <code>script.js</code>. Open Browser DevTools Console (<code>F12</code>) to inspect raw log output.
    </p>

    <section id="bot-output" class="output-box" aria-live="polite">
      <p>Initializing greeting bot...</p>
    </section>

    <div class="footer-note">
      <div>Script file: <span>./script.js</span></div>
      <div>Status: <span>Active</span></div>
    </div>
  </main>

  <script src="./script.js"></script>
  <script>
    // Mirror console.log messages into the UI box without altering script.js
    (function () {
      const outputContainer = document.getElementById("bot-output");
      const originalLog = console.log.bind(console);
      let isFirstMessage = true;

      console.log = function (...args) {
        originalLog(...args);

        if (isFirstMessage) {
          outputContainer.innerHTML = "";
          isFirstMessage = false;
        }

        const line = document.createElement("p");
        line.textContent = args.join(" ");
        outputContainer.appendChild(line);
      };
    })();
  </script>
</body>
</html>
